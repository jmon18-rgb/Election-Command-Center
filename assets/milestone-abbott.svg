<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="t d">
<title id="t">The Blue Texas Parade</title><desc id="d">An empty concession podium sits behind a blue parade float and confetti. The joke concerns the election defeat.</desc>
<defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#07162c"/><stop offset="1" stop-color="#144a75"/></linearGradient></defs>
<rect width="980" height="620" rx="25" fill="url(#g)"/>
<text x="490" y="65" text-anchor="middle" fill="#addcff" font-family="Arial,sans-serif" font-size="25" letter-spacing="5">TEXAS · GOVERNOR</text>
<path d="M107 120H873V350H107Z" fill="#14283b" stroke="#3b5270" stroke-width="5"/>
<text x="490" y="175" text-anchor="middle" fill="#8197b0" font-family="Arial,sans-serif" font-size="26">CONCESSION DESK</text>
<path d="M438 229H542L530 348H450Z" fill="#805a47"/><path d="M487 229V207Q487 190 505 191" fill="none" stroke="#a8becd" stroke-width="6"/>
<rect x="195" y="318" width="590" height="112" rx="18" fill="#0985db" stroke="#78d7ff" stroke-width="7"/>
<g fill="#06203d" stroke="#9ce5ff" stroke-width="6"><circle cx="300" cy="432" r="28"/><circle cx="680" cy="432" r="28"/></g>
<text x="490" y="386" text-anchor="middle" fill="#e9f8ff" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="36">BLUE HAS RIGHT OF WAY</text>
<g fill="#5dcaff"><path d="M220 158l20 5-8 26-20-5ZM744 215l22-5 7 26-22 5ZM316 233l20 10-10 20-20-10ZM662 139l20 8-10 25-20-8Z"/></g>
<text x="490" y="523" text-anchor="middle" fill="#e9f8ff" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="53">MAKE WAY, TEXAS</text>
<text x="490" y="568" text-anchor="middle" fill="#77d7ff" font-family="Arial,sans-serif" font-size="25">A NEW GOVERNOR. AN EXCESSIVE PARADE.</text>
<text x="490" y="602" text-anchor="middle" fill="#abc9df" font-family="Arial,sans-serif" font-size="17">GOVERNOR CALL REQUIRED · SENATE RESULT INDEPENDENT</text></svg>
