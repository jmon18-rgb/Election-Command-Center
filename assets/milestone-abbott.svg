<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="t d">
<title id="t">Timber, Incumbent</title><desc id="d">Original fictional election-night satire: a tree falls onto an Abbott campaign sign. No people are depicted.</desc>
<rect width="980" height="620" rx="25" fill="#071d32"/>
<text x="490" y="60" text-anchor="middle" fill="#a7deff" font-family="Arial,sans-serif" font-size="25">TEXAS · GOVERNOR</text>
<path d="M0 425Q240 390 490 440T980 420V620H0Z" fill="#12405a"/>
<g transform="rotate(12 680 440)"><path d="M590 290V460M780 290V460" stroke="#9cb1ba" stroke-width="10"/><rect x="520" y="245" width="330" height="125" rx="10" fill="#8a344a" stroke="#d0a1aa" stroke-width="5"/><text x="685" y="297" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="40" font-weight="800">ABBOTT</text><text x="685" y="337" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="24">CAMPAIGN</text></g>
<g transform="translate(245 455) rotate(68)"><path d="M-16 0L-12-220 12-220 20 0Z" fill="#8a674b"/><path d="M0-200L-55-258M0-218L54-278" stroke="#8a674b" stroke-width="15"/><ellipse cx="0" cy="-265" rx="110" ry="83" fill="#208c85"/><ellipse cx="-55" cy="-234" rx="70" ry="55" fill="#34a6a2"/></g>
<rect x="520" y="155" width="320" height="65" rx="8" fill="#087ccb"/><text x="680" y="200" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="800">VOTED OUT</text>
<text x="490" y="522" text-anchor="middle" fill="#e9f8ff" font-family="Arial,sans-serif" font-size="49" font-weight="900">TIMBER, INCUMBENT.</text>
<text x="490" y="568" text-anchor="middle" fill="#9bdcff" font-family="Arial,sans-serif" font-size="23">A VERY BAD NIGHT FOR LAWN SIGNS.</text>
<text x="490" y="602" text-anchor="middle" fill="#abc9df" font-family="Arial,sans-serif" font-size="17">FICTIONAL ELECTION-NIGHT ART · GOVERNOR RACE</text></svg>
