<title id="t">DING DONG! — THE WICKED WITCH OF THE EAST IS OUT</title><desc id="d">Original witch-themed Maine election parody: a cartoon witch with a purple hat bearing the label COLLINS, a broom and a sparkling blue sky. No film artwork is used.</desc>
