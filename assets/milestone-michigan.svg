<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="michigan-title michigan-desc">
<title id="michigan-title">FEAR CAMPAIGN: SIGNAL LOST</title>
<desc id="michigan-desc">Original fictional Michigan political satire. A panic-broadcast machine has been muted by a ballot box. Deflated cartoon megaphones, a blue illustrative Michigan mitten, and a receipt reading Error: voters not scared mock fear-based campaign messaging. This illustration is not a results map or evidence of a winner.</desc>
