<title id="t">CORN-FED REBELLION — OSBORN HAS ENTERED THE SILO</title><desc id="d">Nebraska election poster depicting a blue vintage tractor emerging from golden cornfields under the label independent, celebrating a source-reported win for Dan Osborn.</desc>
