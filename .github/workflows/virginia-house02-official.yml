name: Verify pivotal VA02 independent official contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*virginia*'
      - 'data/virginia_house_02*'
      - 'data/virginia_house_02_sources/**'
      - '.github/workflows/virginia-house02-official.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_virginia_house_02_baseline.py
      - run: git diff --exit-code -- data/virginia_house_02_2024_county_baseline_official.json data/virginia_house_02_county_fips_reference.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_virginia_house_02_source.cjs
      - run: node scripts/test_virginia_official_transport.cjs
