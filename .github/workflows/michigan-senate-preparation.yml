name: Verify Michigan Senate historical evidence and open admission gates
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*michigan_senate_preparation.py'
      - 'data/michigan_senate_historical_preparation_assessment.json'
      - 'data/michigan_senate_preparation_sources/**'
      - 'data/michigan_historical_sources/2024-openelections-mi-precinct.csv.gz'
      - 'data/texas_historical_sources/2024-census-counties.zip'
      - 'data/senate_history_2020_2022_2024.json'
      - '.github/workflows/michigan-senate-preparation.yml'
permissions:
  contents: read
jobs:
  evidence-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf==6.10.0
      - name: Preserve original pins, reject malformed counts and avoid invented allocations
        run: python scripts/test_michigan_senate_preparation.py
      - name: Reproduce the assessment without any network or live admission
        run: |
          python scripts/inspect_michigan_senate_preparation.py
          git diff --exit-code -- data/michigan_senate_historical_preparation_assessment.json
