name: Mobile Fish Head full-frame guard
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test_mobile_fish_full_frame.cjs'
      - '.github/workflows/mobile-fish-full-frame.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/test_mobile_fish_full_frame.cjs'
      - '.github/workflows/mobile-fish-full-frame.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-fish:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm portrait-safe mobile artwork and working controls
        run: |
          node --check scripts/test_mobile_fish_full_frame.cjs
          node scripts/test_mobile_fish_full_frame.cjs
          node scripts/check_election_night_asset_versions.cjs
