name: Verify eight missing 2026 race widgets
on:
  pull_request:
    paths:
      - 'scripts/probe_eight_gap_watchvote_2026.cjs'
      - 'scripts/probe_eight_gap_widget_real_browser.mjs'
      - '.github/workflows/eight-gap-widget-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact 2026 race identities and CORS from public provider
        run: |
          node --check scripts/probe_eight_gap_watchvote_2026.cjs
          set -o pipefail
          node scripts/probe_eight_gap_watchvote_2026.cjs | tee widget-source-probe.json
      - name: Preserve explicit source identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-race-public-widget-provider-audit
          path: widget-source-probe.json
          retention-days: 30

  browser-cors:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Probe actual cross-origin browser access for all eight race widgets
        run: node scripts/probe_eight_gap_widget_real_browser.mjs
