name: Verify official 2022 NC Senate county historical discovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/nc_official_zip_staging_bridge.py'
      - 'scripts/run_nc_2022_senate_historical_replay.py'
      - 'scripts/test_nc_2022_senate_historical_replay.py'
      - '.github/workflows/nc-2022-senate-historical.yml'
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact 2022 source identity, digest and nonproduction flags
        run: |
          python3 -m py_compile scripts/run_nc_2022_senate_historical_replay.py
          python3 scripts/test_nc_2022_senate_historical_replay.py
          python3 scripts/test_nc_official_zip_staging_bridge.py
      - name: Download real NCSBE 2022 Senate precinct ZIP and check certified totals
        run: |
          python3 scripts/run_nc_2022_senate_historical_replay.py --discover \
            --output /tmp/nc_2022_senate_official_discovery.json
      - name: Retain archival identity and observed SHA for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nc-2022-official-senate-unpinned-discovery
          path: /tmp/nc_2022_senate_official_discovery.json
          if-no-files-found: ignore
          retention-days: 30
