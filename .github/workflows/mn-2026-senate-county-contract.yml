name: Guard Minnesota Senate county candidate-only source contract
on:
  pull_request:
    paths:
      - 'scripts/mn_2026_official_senate_county_advisory.py'
      - 'scripts/test_mn_2026_official_senate_county_advisory.py'
      - '.github/workflows/mn-2026-senate-county-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/mn_2026_official_senate_county_advisory.py'
      - 'scripts/test_mn_2026_official_senate_county_advisory.py'
      - '.github/workflows/mn-2026-senate-county-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-candidate-only-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile scripts/mn_2026_official_senate_county_advisory.py
          python scripts/test_mn_2026_official_senate_county_advisory.py
