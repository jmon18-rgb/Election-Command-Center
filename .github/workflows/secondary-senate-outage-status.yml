name: Verify supplemental Senate source outage states on Election Night
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/election_night_506_live_gap_desk.js'
      - 'scripts/test_election_night_506_live_gap_desk.cjs'
      - '.github/workflows/secondary-senate-outage-status.yml'
permissions:
  contents: read
jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source breaker/pending/failed/fresh coverage semantics
        run: |
          node --check scripts/election_night_506_live_gap_desk.js
          node scripts/test_election_night_506_live_gap_desk.cjs
          node scripts/test_election_night_reconciliation.cjs
