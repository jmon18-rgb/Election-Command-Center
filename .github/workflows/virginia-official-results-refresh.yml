name: Collect official VA02 results into an owned data-only cache
on:
  push:
    branches: [main]
    paths:
      - 'scripts/official_native_archive.cjs'
      - 'scripts/official_native_archive_crypto.cjs'
      - 'scripts/publish_virginia_official_cache.cjs'
      - '.github/workflows/virginia-official-results-refresh.yml'
  workflow_dispatch:
    inputs:
      health_only:
        description: Pre-election transport check with no published vote payload
        type: boolean
        default: true
  schedule:
    # Data-only collection continues through Virginia's certification period;
    # the owner's Nov4 code-change stop does not terminate result updates.
    - cron: '*/5 * 4 11 *'
    - cron: '*/5 * 5-24 11 *'
    - cron: '*/5 0-7 25 11 *'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*virginia*'
      - 'scripts/official_native_archive.cjs'
      - 'scripts/official_native_archive_crypto.cjs'
      - 'scripts/test_official_native_archive.cjs'
      - 'data/virginia_*'
      - '.github/workflows/virginia-official-results-refresh.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/test_collect_virginia_official_results.cjs
          node scripts/test_virginia_official_cache.cjs
  publish-data:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    concurrency:
      group: official-virginia-data-cache
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded official collection; never writes the code branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFICIAL_NATIVE_ARCHIVE_APPROVED: ${{ vars.OFFICIAL_NATIVE_ARCHIVE_APPROVED }}
          OFFICIAL_NATIVE_ARCHIVE_NO_PAID_STORAGE: ${{ vars.OFFICIAL_NATIVE_ARCHIVE_NO_PAID_STORAGE }}
          OFFICIAL_NATIVE_ARCHIVE_FREE_BYTES: ${{ vars.OFFICIAL_NATIVE_ARCHIVE_FREE_BYTES }}
          OFFICIAL_NATIVE_ARCHIVE_CAPACITY_AT: ${{ vars.OFFICIAL_NATIVE_ARCHIVE_CAPACITY_AT }}
          HEALTH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.health_only && 'true' || 'false' }}
          EVENT_KIND: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_KIND" = "push" ]; then
            node scripts/publish_virginia_official_cache.cjs --publish --bootstrap
          elif [ "$HEALTH_ONLY" = "true" ]; then
            node scripts/publish_virginia_official_cache.cjs --publish --health-only
          else
            node scripts/publish_virginia_official_cache.cjs --publish
          fi
      - name: Retain encrypted first-night originals only with verified free capacity
        if: ${{ always() && github.event_name == 'schedule' && github.run_attempt == 1 && vars.OFFICIAL_NATIVE_ARCHIVE_APPROVED == 'true' && vars.OFFICIAL_NATIVE_ARCHIVE_NO_PAID_STORAGE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: official-native-va02-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/readiness/official-native-va02/
          retention-days: 30
          compression-level: 6
          include-hidden-files: false
          overwrite: false
          if-no-files-found: warn
