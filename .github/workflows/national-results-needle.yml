name: National county results to Four Endings needle
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/chamber_control_model.js'
      - 'scripts/source_call_conditioning.js'
      - 'scripts/joint_model_worker*.js'
      - 'scripts/joint_count_snapshot_policy.js'
      - 'scripts/check_joint_model_worker_assets.cjs'
      - 'scripts/test_joint_model_worker*'
      - 'scripts/test_joint_count_snapshot_policy.cjs'
      - 'scripts/test_joint_count_snapshot_browser.mjs'
      - 'scripts/test_joint_official_snapshot_policy.cjs'
      - 'scripts/test_joint_official_snapshot_browser.mjs'
      - 'scripts/*washington*'
      - 'scripts/test_source_call_conditioning*'
      - 'scripts/test_source_call_resource_law.cjs'
      - 'scripts/test_source_call_occupancy_guide.cjs'
      - 'scripts/test_source_call_full_frame_browser.mjs'
      - 'scripts/test_chamber_private_transport_cache.cjs'
      - 'scripts/test_chamber_source_call_conditioning.cjs'
      - 'scripts/fictional_call_basis.cjs'
      - 'scripts/national_*.js'
      - 'scripts/test_national_*.cjs'
      - 'scripts/test_national_*.mjs'
      - 'scripts/*_needle_view.js'
      - 'scripts/*_civic_county_source.js'
      - 'scripts/*ohio*'
      - 'scripts/*south_carolina*'
      - 'data/south_carolina_senate_sources/**'
      - 'scripts/*virginia*'
      - 'scripts/*pennsylvania*07*'
      - 'scripts/competitive_*.js'
      - 'scripts/election_night_signals.js'
      - 'scripts/personal_election_focus.js'
      - 'scripts/test_personal_election_focus*'
      - 'scripts/test_personal_election_pending*'
      - 'scripts/test_rehearsal_readability_browser.mjs'
      - 'scripts/wisconsin_house*.js'
      - 'data/*county*.json'
      - '.github/workflows/national-results-needle.yml'
permissions:
  contents: read
jobs:
  national-results:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check coherent correlated draws and counts-only likelihood
        run: |
          node scripts/test_competitive_source_cadence.cjs
          node scripts/test_chamber_control_model.cjs
          node scripts/test_source_call_conditioning.cjs
          node scripts/test_source_call_resource_law.cjs
          node scripts/test_source_call_occupancy_guide.cjs
          node scripts/test_joint_count_snapshot_policy.cjs
          node scripts/test_joint_official_snapshot_policy.cjs
          node scripts/test_washington_asof_current_rules.cjs
          node scripts/test_chamber_private_transport_cache.cjs
          node scripts/test_chamber_source_call_conditioning.cjs
          node scripts/test_national_call_conditioning.cjs
          node scripts/test_joint_model_worker_controller.cjs
          node scripts/test_joint_model_worker_assets.cjs
          node scripts/test_joint_model_worker_main_api.cjs
          node scripts/test_national_county_likelihood.cjs
          node scripts/test_official_admission_audit.cjs
          node scripts/test_official_admission_controller.cjs
          node scripts/test_personal_election_focus.cjs
          node scripts/test_maine_national_bridge.cjs
          node scripts/test_ohio_national_bridge.cjs
          node scripts/test_ohio_controller_budget.cjs
          node scripts/test_south_carolina_county_source.cjs
          node scripts/test_south_carolina_controller_budget.cjs
          node scripts/test_maine_controller_budget.cjs
          node scripts/test_collect_virginia_official_results.cjs
          node scripts/test_virginia_official_cache.cjs
          node scripts/test_virginia_house_02_source.cjs
          node scripts/test_virginia_official_transport.cjs
          node scripts/test_virginia_house_02_national_bridge.cjs
          node scripts/test_virginia_house_02_controller_budget.cjs
          node scripts/test_arizona_house_06_county_source.cjs
          node scripts/test_arizona_house_06_national_bridge.cjs
          node scripts/test_arizona_house_06_controller_budget.cjs
          node scripts/test_michigan_house_07_national_bridge.cjs
          node scripts/test_michigan_house_07_controller_budget.cjs
          node scripts/test_pennsylvania_house_08_national_bridge.cjs
          node scripts/test_pennsylvania_house_08_controller_budget.cjs
          node scripts/test_pennsylvania_house_07_national_bridge.cjs
          node scripts/test_pennsylvania_house_07_controller_budget.cjs
          node scripts/test_washington_national_bridge.cjs
      - name: Install pinned browser
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Test the primary national needle before calls and isolated rehearsal
        run: |
          node scripts/test_national_results_needle_browser.mjs
          node scripts/test_personal_election_focus_browser.mjs
          node scripts/test_rehearsal_readability_browser.mjs
          node scripts/test_maine_national_browser.mjs
          node scripts/test_ohio_national_browser.mjs
          node scripts/test_south_carolina_national_browser.mjs
          node scripts/test_virginia_house_02_national_browser.mjs
          node scripts/test_arizona_house_06_national_browser.mjs
          node scripts/test_pennsylvania_house_07_national_browser.mjs
