name: Stage historical Senate poll-only research backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/research_rcp_senate_backtest.py'
      - 'scripts/test_historical_senate_poll_backtest.py'
      - 'scripts/test_rcp_senate_research.py'
      - 'scripts/research_senate_horizon_backtest.py'
      - 'scripts/research_senate_2018_extension.py'
      - 'scripts/test_senate_2018_extension.py'
      - 'data/historical_senate_2018_extension.json'
      - 'scripts/test_senate_horizon_backtest.py'
      - 'scripts/build_senate_bias_holdout.py'
      - 'scripts/test_senate_bias_holdout.py'
      - '.github/workflows/historical-senate-backtest.yml'
permissions:
  contents: write
concurrency:
  group: historical-senate-backtest
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Run leakage and source-integrity unit tests
        run: python3 scripts/test_historical_senate_poll_backtest.py
      - name: Test historical RCP source and special-election exclusions
        run: python3 scripts/test_rcp_senate_research.py
      - name: Stage source-attributed historical error research
        run: python3 scripts/research_rcp_senate_backtest.py
      - name: Rebuild fieldwork-horizon Senate research without poll-release hindsight claims
        run: |
          python3 scripts/test_senate_horizon_backtest.py
          python3 scripts/research_senate_horizon_backtest.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('data/historical_senate_horizon_backtest.json').read_text())
          assert doc['status']=='RETROSPECTIVE_FIELDWORK_PROXY_NOT_AS_OF_VALIDATED'
          assert doc['cutoffs_days_before_election']==[60,45,30,20,14,10,7,3]
          assert doc['may_calibrate_2026_probabilities'] is False
          assert doc['may_automatically_change_live_2026_sigma'] is False
          assert doc['first_publication_dates_available'] is False
          assert all(h['unique_election_cycles']>=2 for h in doc['horizon_results'] if h['race_snapshots']>=10)
          print('Fieldwork-horizon study independently validated')
          PY
      - name: Refresh independent 2018 Senate midterm fieldwork horizon study
        run: |
          python3 scripts/test_senate_2018_extension.py
          python3 scripts/research_senate_2018_extension.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/historical_senate_2018_horizon_backtest.json').read_text())
          assert d['cycle']==2018 and len(d['records']['20'])>=15
          assert d['poll_release_dates_verified'] is False
          assert d['can_calibrate_live_2026_model'] is False
          assert d['may_change_production_candidate_priors'] is False
          print('Independent 2018 Senate historical extension reproduced')
          PY
      - name: Test and calculate cross-election-year bias correction robustness
        run: |
          python3 scripts/test_senate_bias_holdout.py
          python3 scripts/build_senate_bias_holdout.py
      - name: Verify never publishes win odds or unsupported forecast
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('data/historical_senate_poll_backtest.json').read_text())
          assert not o['is_forecast'] and not o['can_calibrate_2026_win_probabilities']
          assert o['races_evaluated']==len(o['records'])
          assert o['poll_source_sha256']
          assert set(o['by_year'])=={'2020','2022','2024'}
          for r in o['records']:
              assert r['cycle'] in (2020,2022,2024)
              assert r['pollster_count']>=2
              assert r['cutoff'] and r['field_end_range'][1]<=r['cutoff']
          print('Historical poll-only research validation:',o['races_evaluated'],'races')
          holdout=json.loads(Path('data/senate_bias_year_holdout.json').read_text())
          assert holdout['source_race_count']==o['races_evaluated']
          assert not holdout['is_forecast'] and not holdout['is_as_of_leakage_free']
          assert not holdout['is_statistically_calibrated_for_2026']
          assert not holdout['permitted_to_change_live_2026_polling_model']
          assert len(holdout['by_test_year'])==3
          print('Independent election-year holdout diagnostic validated.')
          PY
      - name: Publish derived metrics and source attribution, not raw surveys
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "historical-poll-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- scripts/research_rcp_senate_backtest.py scripts/test_historical_senate_poll_backtest.py scripts/test_rcp_senate_research.py scripts/research_senate_horizon_backtest.py scripts/test_senate_horizon_backtest.py scripts/research_senate_2018_extension.py scripts/test_senate_2018_extension.py data/historical_senate_2018_extension.json scripts/build_senate_bias_holdout.py scripts/test_senate_bias_holdout.py; then
            echo "Source importer changed during research; skipping stale metrics."
            exit 0
          fi
          git reset --mixed origin/main
          git add data/historical_senate_poll_backtest.json data/historical_senate_horizon_backtest.json data/historical_senate_2018_horizon_backtest.json data/senate_bias_year_holdout.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage historical Senate poll-only backtest diagnostic"
          git push origin HEAD:main
