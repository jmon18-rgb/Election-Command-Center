name: Verify official Washington competitive House source contract
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*washington*'
      - 'data/washington_*'
      - 'data/washington_historical_sources/**'
      - '.github/workflows/washington-official-house-source.yml'
permissions:
  contents: read
jobs:
  original-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 scripts/build_washington_house_county_baseline.py --check
          python3 scripts/test_washington_house_baseline.py
          node --check scripts/washington_official_house_source.js
          node scripts/test_washington_official_house_source.cjs
          node --check scripts/collect_washington_official_results.cjs
          node scripts/test_collect_washington_official_results.cjs
          node scripts/test_washington_official_cache.cjs
          node scripts/test_washington_national_bridge.cjs
          git diff --exit-code
  national-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install complete browser dependencies from the primary Ubuntu archive
        run: |
          # The runner's Azure mirror timed out twice before browser assertions.
          # Keep signed packages, all dependencies, tests and the same job budget.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium --only-shell
      - run: node scripts/test_washington_national_browser.mjs
