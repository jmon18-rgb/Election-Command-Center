name: Kansas competitive county input contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/kansas*'
      - 'data/kansas_historical_sources/**'
      - 'scripts/*kansas*'
      - 'scripts/iowa_county_needle.js'
      - 'scripts/election_night_transport.js'
      - 'index.html'
      - 'scripts/competitive_needle_prior.js'
      - 'scripts/test_competitive_needle_prior.cjs'
      - 'scripts/read_official_xlsx_rows.py'
      - '.github/workflows/kansas-county-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-facts-and-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce official county sums from exact original workbook bytes
        run: |
          python3 scripts/build_kansas_senate_county_facts.py --check
          python3 scripts/build_kansas_governor_close_cohort.py --check
      - name: Validate Kansas input contract and exclude test votes
        run: node scripts/test_kansas_civic_county_source.cjs
      - name: Validate experimental Kansas source-to-forecast behavior
        run: node scripts/test_kansas_county_needle.cjs
      - name: Evaluate official historical returns against prior-only and raw baselines
        run: |
          node scripts/evaluate_kansas_county_needle.cjs
          node scripts/evaluate_kansas_governor_close_cohort.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kansas-historical-forecast-evidence-not-calibration
          path: artifacts/readiness/kansas/*evaluation.json
          if-no-files-found: error
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Exercise validated Kansas source to visible race needle on laptop and mobile
        run: node scripts/test_kansas_needle_browser.mjs
