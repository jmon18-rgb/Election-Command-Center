name: Minnesota 2026 official results mock-status watch
on:
  pull_request:
    paths:
      - 'scripts/probe_mn_2026_official_results_status.py'
      - 'scripts/test_probe_mn_2026_official_results_status.py'
      - '.github/workflows/mn-2026-mock-status-watch.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/probe_mn_2026_official_results_status.py'
      - 'scripts/test_probe_mn_2026_official_results_status.py'
      - '.github/workflows/mn-2026-mock-status-watch.yml'
  schedule:
    - cron: '21 14 * * *'
    - cron: '38 * 3-4 11 *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mn-production-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject test-only 2026 general pages and unapproved source claims
        run: |
          python -m py_compile scripts/probe_mn_2026_official_results_status.py
          python scripts/test_probe_mn_2026_official_results_status.py
      - name: Read only official Minnesota general-page status, never vote data
        run: |
          python scripts/probe_mn_2026_official_results_status.py | tee /tmp/mn-source-status.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/mn-source-status.json'))
          assert x['candidate_votes'] is None
          assert x['professional_calls'] is None
          assert x['may_update_model'] is False
          assert x['validated_live_feed'] is False
          assert x['race_ids_verified'] is False
          PY
      - name: Discover official MN 2026 export URL identities only — never download test vote files
        run: |
          python - <<'PY' | tee /tmp/mn-export-status.json
          import json,sys
          sys.path.insert(0, 'scripts')
          from probe_mn_2026_official_results_status import probe_export_index
          x=probe_export_index()
          assert x['candidate_votes'] is None
          assert x['ballots_reported'] is None
          assert x['winner_calls'] is None
          assert x['retrieved_vote_files'] == 0
          assert x['validated_live_feed'] is False
          assert x['may_update_model'] is False
          assert x['geographic_needle_calibrated'] is False
          print(json.dumps(x,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minnesota-2026-official-status-no-votes
          path: |
            /tmp/mn-source-status.json
            /tmp/mn-export-status.json
          retention-days: 30
