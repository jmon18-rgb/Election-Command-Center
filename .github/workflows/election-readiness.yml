name: Election readiness report
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: read
concurrency:
  group: election-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run core checks and write evidence summary
        run: node scripts/run_election_readiness.cjs
      - name: Upload report and individual logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: election-readiness-core
          path: artifacts/readiness/
          if-no-files-found: error
          retention-days: 30
  deployed:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual production site independently
        env:
          DASHBOARD_SITE_URL: ${{ vars.DASHBOARD_SITE_URL }}
        run: node scripts/test_published_dashboard.cjs --remote
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing pinned browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Desktop and mobile outage smoke
        run: node scripts/test_real_browser_election_night.mjs
      - name: Exact background model bundles, cancellation and responsive desktop and mobile controls
        if: ${{ !cancelled() }}
        run: node scripts/test_joint_model_worker_browser.mjs
      - name: Pending personal forecasts preserve disclosure, keyboard position and clear stale predictions
        if: ${{ !cancelled() }}
        run: node scripts/test_personal_election_pending_browser.mjs
      - name: Full app rejects held old worker frames across calls, context, archive, hidden and timeout recovery
        if: ${{ !cancelled() }}
        run: node scripts/test_joint_model_worker_app_browser.mjs
      - name: Upload background-model and pending-view evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-worker-browser
          path: |
            artifacts/readiness/ui-review/model-worker/
            artifacts/readiness/ui-review/personal-election-pending/
            artifacts/readiness/ui-review/joint-model-worker-app/
          if-no-files-found: warn
          retention-days: 7
      - name: National results failure and recovery
        if: ${{ !cancelled() }}
        run: node scripts/test_election_night_506_live_browser_recovery.mjs
      - name: Celebration announcement and animation mechanics on desktop and mobile
        if: ${{ !cancelled() }}
        run: node scripts/test_celebration_player_browser.mjs
      - name: Individual ratings and automatic celebration popup journey
        if: ${{ !cancelled() }}
        run: node scripts/test_ratings_celebration_popup_browser.mjs
      - name: Validated-call context, exact withdrawal and unsupported transfer on desktop and mobile
        if: ${{ !cancelled() }}
        run: node scripts/test_source_call_conditioning_browser.mjs
      - name: Upload conditional-call browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-call-conditioning-browser
          path: artifacts/readiness/ui-review/source-call-conditioning/
          retention-days: 7
      - name: Private ad-free audio persistence and supplied Abbott artwork
        if: ${{ !cancelled() }}
        run: node scripts/test_celebration_local_browser.mjs
      - name: Late audio storage completions cannot restart a new celebration
        if: ${{ !cancelled() }}
        run: node scripts/test_celebration_local_races_browser.mjs
      - name: Texas shared needle and early House watch keyboard and retraction journey
        if: ${{ !cancelled() }}
        run: node scripts/test_house_early_watch_browser.mjs
      - name: Reading context survives celebrations, queued bulletins and background redraws
        if: ${{ !cancelled() }}
        run: node scripts/test_celebration_reading_return_browser.mjs
      - name: Render the original event scores and verify stopped playback is silent
        if: ${{ !cancelled() }}
        run: node scripts/render_celebration_music_previews.mjs
      - name: Competitive House and Senate source recovery on desktop and mobile
        if: ${{ !cancelled() }}
        run: node scripts/test_competitive_source_recovery_browser.mjs
      - name: Upload source recovery browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-recovery-browser
          path: artifacts/readiness/source-recovery-*.png
          if-no-files-found: warn
      - name: Upload Texas and early House watch operator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-house-watch-browser
          path: artifacts/readiness/ui-review/texas-house-watch/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload celebration browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celebration-browser-previews
          path: artifacts/readiness/celebration-*.png
          if-no-files-found: warn
