name: Refresh election briefing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_briefing.py'
      - 'scripts/update_polls.py'
      - 'scripts/update_pollresults_recent.py'
      - 'scripts/test_polling_models.py'
      - 'scripts/build_polling_estimates.py'
      - 'scripts/build_race_probabilities.py'
      - 'scripts/test_race_probabilities.py'
      - 'scripts/build_seat_universe.py'
      - 'scripts/build_map_bridge.py'
      - 'scripts/test_map_bridge.py'
      - 'scripts/build_house_two_cycle.py'
      - 'scripts/test_house_two_cycle.py'
      - 'data/house_history_2022_staging.json'
      - 'data/house_history_2024_staging.json'
      - 'scripts/test_seat_universe.py'
      - 'scripts/update_integrity_queue.py'
      - 'scripts/validate_integrity_impact.py'
      - 'scripts/check_dashboard.py'
      - 'scripts/test_dashboard_runtime.cjs'
      - 'scripts/notify_new_polls.py'
      - 'scripts/test_poll_alerts.py'
      - 'ALERTS.md'
      - 'scripts/validate_model_drilldown.py'
      - 'index.html'
      - 'data/integrity_impact.json'
      - 'data/pollster_quality.json'
      - '.github/workflows/refresh-briefing.yml'
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency:
  group: election-briefing
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check dashboard JavaScript and layout contracts
        run: python3 scripts/check_dashboard.py
      - name: Syntax-check full DOM regression script
        run: node --check scripts/test_dashboard_runtime.cjs
      # The full browser DOM integration test intentionally belongs in PR CI.
      # It contains historic poll-specific fixture assertions which are NOT
      # stable source-data invariants.  Do not prevent scheduled new-poll
      # ingestion/publication when old source polls fall outside rolling feeds.
      # Scheduled refresh instead validates the source schema/freshness and
      # that the regenerated model derives from the new polling snapshot.
      - name: Collect election reporting
        continue-on-error: true
        run: python3 scripts/update_briefing.py
      - name: Validate published integrity evidence
        run: python3 scripts/validate_integrity_impact.py
      - name: Queue integrity reports for source verification
        run: python3 scripts/update_integrity_queue.py
      - name: Collect 2026 polling data
        continue-on-error: true
        run: python3 scripts/update_polls.py
      - name: Supplement polling with dated source links and poll-type data
        continue-on-error: true
        run: python3 scripts/update_pollresults_recent.py
      # The full DOM test ran against the checked-in, reproducible snapshot
      # BEFORE external polling ingestion. Do not rerun its fixture-specific
      # ReconMR/GBAO click assertions against NEW live candidate observations:
      # that caused every scheduled refresh to fail before publishing.
      - name: Validate newly collected poll sources without frozen pollster fixtures
        run: python3 scripts/validate_fresh_poll_sources.py
      - name: Run model diagnostics
        run: python3 scripts/test_polling_models.py
      - name: Build Senate polling estimates
        run: python3 scripts/build_polling_estimates.py
      - name: Test live-polling-based race probabilities
        run: python3 scripts/test_race_probabilities.py
      - name: Rebuild probability data against refreshed polling
        run: python3 scripts/build_race_probabilities.py
      - name: Verify all model polls and averages
        run: python3 scripts/validate_model_drilldown.py
      - name: Test complete congressional seat inventory
        run: python3 scripts/test_seat_universe.py
      - name: Build verified seat inventory and forecast-readiness gate
        run: python3 scripts/build_seat_universe.py
      - name: Test 2024-to-2026 district geography mapping
        run: python3 scripts/test_map_bridge.py
      - name: Build 2026 House redistricting safeguards
        run: python3 scripts/build_map_bridge.py
      - name: Test historical district comparability across three elections
        run: python3 scripts/test_house_two_cycle.py
      - name: Build safe 2022-2024 historical swing context
        run: python3 scripts/build_house_two_cycle.py
      - name: Test new-poll notification filtering and deduplication
        run: python3 scripts/test_poll_alerts.py
      - name: Email newly indexed polls if SMTP credentials are configured
        env:
          POLL_GMAIL_ADDRESS: ${{ secrets.POLL_GMAIL_ADDRESS }}
          POLL_GMAIL_APP_PASSWORD: ${{ secrets.POLL_GMAIL_APP_PASSWORD }}
          POLL_SMTP_HOST: ${{ secrets.POLL_SMTP_HOST }}
          POLL_SMTP_PORT: ${{ secrets.POLL_SMTP_PORT }}
          POLL_SMTP_USERNAME: ${{ secrets.POLL_SMTP_USERNAME }}
          POLL_SMTP_PASSWORD: ${{ secrets.POLL_SMTP_PASSWORD }}
          POLL_ALERT_FROM: ${{ secrets.POLL_ALERT_FROM }}
          POLL_ALERT_TO: ${{ secrets.POLL_ALERT_TO }}
        run: python3 scripts/notify_new_polls.py
      - name: Validate generated polling snapshot still links to the new source
        run: python3 scripts/validate_fresh_poll_sources.py --generated
      - name: Commit updated briefing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "election-briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_sha="$(git rev-parse HEAD)"
          for attempt in 1 2 3; do
            git fetch origin main
            # Rebuild with the next scheduled run rather than publishing JSON
            # calculated against a newer/revised forecasting algorithm.
            if ! git diff --quiet "$source_sha" origin/main -- index.html scripts/ .github/workflows/; then
              echo "Application or pipeline changed during refresh. Skipping stale outputs; the new source revision has its own refresh."
              exit 0
            fi
            # Never overwrite a newer successful model refresh with data
            # computed by an earlier workflow run.
            if python3 - <<'PY'
          import datetime as dt
          import json
          import subprocess
          from pathlib import Path
          local=json.loads(Path("data/polling_estimates.json").read_text(encoding="utf-8"))
          try:
              text=subprocess.check_output(["git","show","origin/main:data/polling_estimates.json"],text=True)
              remote=json.loads(text)
              a=dt.datetime.fromisoformat(local["generated_at"].replace("Z","+00:00"))
              b=dt.datetime.fromisoformat(remote["generated_at"].replace("Z","+00:00"))
              raise SystemExit(0 if b>=a else 1)
          except (subprocess.CalledProcessError,KeyError,ValueError):
              raise SystemExit(1)
          PY
            then
              echo "A newer polling refresh is already published. Skipping this older snapshot."
              exit 0
            fi
            # Rebase GENERATED OUTPUTS as fresh changes on the newest remote
            # commit, not an entire stale JSON commit that can conflict.
            git reset --mixed origin/main
            git add data/briefing.json data/polls.json data/model_tests.json data/polling_estimates.json data/integrity_review_queue.json data/model_history.json data/seat_universe.json data/house_geography_bridge.json data/house_two_cycle_context.json data/race_probabilities.json data/poll_alert_state.json
            if [ -f data/pollresults_recent.json ]; then git add data/pollresults_recent.json; fi
            if git diff --cached --quiet; then
              echo "No source-data changes to commit."
              exit 0
            fi
            git commit -m "Update sourced election briefing"
            if git push origin HEAD:main; then
              echo "Refresh published."
              exit 0
            fi
            echo "Concurrent push; retrying against newer remote HEAD (attempt $attempt)."
            git reset --mixed HEAD~1
          done
          echo "Could not publish refreshed data after three non-destructive retries."
          exit 1
