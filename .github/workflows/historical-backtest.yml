name: Historical Senate model backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest_historical_senate.py'
      - 'scripts/run_historical_backtest.py'
      - '.github/workflows/historical-backtest.yml'
permissions:
  contents: write
jobs:
  historical-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compare historical Senate polling with published election results
        run: python3 scripts/run_historical_backtest.py
      - name: Commit historical evaluation report
        run: |
          git config user.name "election-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical_backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish historical Senate model evaluation"
            git push
          fi
