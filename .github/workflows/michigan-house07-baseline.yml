name: Verify pivotal MI07 processed baseline and official roster
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/*michigan*07*'
      - 'scripts/build_michigan_house_county_baseline.py'
      - 'scripts/wisconsin_house_county_source.js'
      - 'scripts/national_county_likelihood.js'
      - 'scripts/chamber_control_model.js'
      - 'scripts/competitive_source_revision.js'
      - 'scripts/election_night_source_*.js'
      - 'data/michigan_house_07*'
      - 'data/michigan_house_07_sources/**'
      - 'data/michigan_historical_sources/**'
      - 'data/texas_historical_sources/2024-census-counties.zip'
      - '.github/workflows/michigan-house07-baseline.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pypdf==6.10.0
      - run: python scripts/test_michigan_house_07_baseline.py
      - run: git diff --exit-code -- data/michigan_house_07_2024_county_baseline_processed.json data/michigan_house_07_county_fips_reference.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_michigan_house_07_county_source.cjs

  national-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test_michigan_house_07_national_browser.mjs
