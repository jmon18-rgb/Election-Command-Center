name: Verify 506-race Election Night live-results coverage desk
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/election_night_506_live_gap_desk.js'
      - 'scripts/test_election_night_506_live_gap_desk.cjs'
      - 'scripts/test_dashboard_runtime.cjs'
      - '.github/workflows/election-night-506-live-gap-desk.yml'
      - 'data/election_night_source_coverage.json'
permissions:
  contents: read
jobs:
  exact-race-triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 506 race identities, zero source counts and provider failures
        run: |
          node --check scripts/election_night_506_live_gap_desk.js
          node scripts/test_election_night_506_live_gap_desk.cjs
          node scripts/test_election_night_reconciliation.cjs
          node scripts/test_election_night_twelve_hour_transport.cjs
