name: Validate election dashboard PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard contracts
        run: python3 scripts/check_dashboard.py
      - name: Validate DDHQ snapshot and parser
        run: python3 scripts/test_scenario_forecast.py
      - name: Validate new-poll notification behavior without email credentials
        run: python3 scripts/test_poll_alerts.py
      - name: Validate historical Senate election importer without network access
        run: python3 scripts/test_senate_history.py
      - name: Stage MIT Senate research outcomes from official Harvard Dataverse
        run: python3 scripts/stage_senate_history.py
      - name: Test historical Senate poll-only backtesting and date leakage
        run: python3 scripts/test_historical_senate_poll_backtest.py
      - name: Test three historical Senate RCP compilation archives without network
        run: python3 scripts/test_rcp_senate_research.py
      - name: Validate actual archived RCP compilation and historical Senate joins
        run: python3 scripts/research_rcp_senate_backtest.py
      - name: Test independent election-year heldout national polling-bias diagnostics
        run: python3 scripts/test_senate_bias_holdout.py
      - name: Reproduce historical Senate bias holdouts from published source metrics
        run: python3 scripts/build_senate_bias_holdout.py
      - name: Validate polling model behavior
        run: python3 scripts/test_polling_models.py
      - name: Verify browser-compatible live official-state election API
        run: python3 scripts/test_live_results_source.py
      - name: Install DOM test environment
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
      - name: Check JavaScript syntax and exercise actual dashboard
        run: |
          node --check scripts/test_dashboard_runtime.cjs
          node scripts/test_dashboard_runtime.cjs
