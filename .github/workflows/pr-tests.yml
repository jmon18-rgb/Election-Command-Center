name: Validate election dashboard PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard contracts
        run: python3 scripts/check_dashboard.py
      - name: Validate DDHQ snapshot and parser
        run: python3 scripts/test_scenario_forecast.py
      - name: Validate new-poll notification behavior without email credentials
        run: python3 scripts/test_poll_alerts.py
      - name: Validate historical Senate election importer without network access
        run: python3 scripts/test_senate_history.py
      - name: Stage MIT Senate research outcomes from official Harvard Dataverse
        run: python3 scripts/stage_senate_history.py
      - name: Test historical Senate poll-only backtesting and date leakage
        run: python3 scripts/test_historical_senate_poll_backtest.py
      - name: Test three historical Senate RCP compilation archives without network
        run: python3 scripts/test_rcp_senate_research.py
      - name: Validate actual archived RCP compilation and historical Senate joins
        run: python3 scripts/research_rcp_senate_backtest.py
      - name: Test independent election-year heldout national polling-bias diagnostics
        run: python3 scripts/test_senate_bias_holdout.py
      - name: Reproduce historical Senate bias holdouts from published source metrics
        run: python3 scripts/build_senate_bias_holdout.py
      - name: Validate polling model behavior
        run: python3 scripts/test_polling_models.py
      - name: Test 2026 race odds against real poll inputs
        run: python3 scripts/test_race_probabilities.py
      - name: Rebuild 2026 race probabilities from the same polling source
        run: python3 scripts/build_race_probabilities.py
      - name: Verify browser-compatible live official-state election API
        run: python3 scripts/test_live_results_source.py
      - name: Nonpublishing secondary civicAPI 2026 coverage and CORS probe
        continue-on-error: true
        run: python3 scripts/probe_civicapi.py
      - name: Test isolated New Hampshire Senate civicAPI adapter
        run: |
          node --check scripts/civicapi_nh_adapter.js
          node --check scripts/test_civicapi_nh_adapter.cjs
          node scripts/test_civicapi_nh_adapter.cjs
      - name: Test isolated New Hampshire governor civicAPI adapter
        run: |
          node --check scripts/civicapi_nh_governor_adapter.js
          node --check scripts/test_civicapi_nh_governor_adapter.cjs
          node scripts/test_civicapi_nh_governor_adapter.cjs
      - name: Test four-state supplemental civicAPI race adapters
        run: |
          node --check scripts/civicapi_state_batch.js
          node --check scripts/test_civicapi_state_batch.cjs
          node scripts/test_civicapi_state_batch.cjs
      - name: Test Ohio special and six more 2026 statewide race adapters
        run: |
          node --check scripts/civicapi_state_batch.js
          node --check scripts/test_civicapi_oh_wi_ne_ks.cjs
          node scripts/test_civicapi_oh_wi_ne_ks.cjs
      - name: Probe four new states for indexed 2026 civicAPI contests
        continue-on-error: true
        run: python3 scripts/probe_civicapi_oh_wi_ne_ks.py
      - name: Validate seven additional five-state civicAPI race identities
        run: |
          node --check scripts/civicapi_state_batch.js
          node --check scripts/test_civicapi_il_ky_nj_ny_or.cjs
          node scripts/test_civicapi_il_ky_nj_ny_or.cjs
      - name: Discover five additional 2026 civicAPI state race sources
        continue-on-error: true
        run: python3 scripts/probe_civicapi_il_ky_nj_ny_or.py
      - name: Advisory four-state civicAPI source indexing health
        continue-on-error: true
        run: python3 scripts/probe_civicapi_batch.py
      # Third-party 503 is a health warning; source contracts are tested offline.
      - name: Advisory civicAPI live-provider health and CORS
        continue-on-error: true
        run: python3 scripts/test_civicapi_live_source.py
      - name: Test eight additional Senate and governor civicAPI adapters
        run: |
          node --check scripts/civicapi_state_batch.js
          node --check scripts/test_civicapi_al_mt_nm_ok_tn.cjs
          node scripts/test_civicapi_al_mt_nm_ok_tn.cjs
      - name: Discover five more uncovered 2026 states in real civicAPI
        continue-on-error: true
        run: python3 scripts/probe_civicapi_al_mt_nm_ok_tn.py
      - name: Test seven strict CA DE MD SD WY civicAPI race adapters
        run: |
          node --check scripts/civicapi_state_batch.js
          node --check scripts/test_civicapi_ca_de_sd_wy.cjs
          node scripts/test_civicapi_ca_de_sd_wy.cjs
      - name: Probe civicAPI statewide 2026 source IDs in CA DE MS SD WY
        continue-on-error: true
        run: python3 scripts/probe_civicapi_ca_de_ms_sd_wy.py
      - name: Validate experimental live-informed race probabilities
        run: |
          node --check scripts/election_night_nowcast.js
          node --check scripts/test_election_night_nowcast.cjs
          node scripts/test_election_night_nowcast.cjs
      - name: Test isolated five-stage election-night probability rehearsal
        run: |
          node --check scripts/election_night_rehearsal.js
          node --check scripts/test_election_night_rehearsal.cjs
          node scripts/test_election_night_rehearsal.cjs
      - name: Validate joint House and Senate outcome probabilities
        run: |
          node --check scripts/chamber_control_model.js
          node scripts/test_chamber_control_model.cjs
      - name: Audit forecast optimism under shared polling errors
        run: |
          node --check scripts/forecast_optimism_audit.cjs
          node scripts/forecast_optimism_audit.cjs --json > /tmp/forecast-optimism-audit.json
          node -e "const x=require('/tmp/forecast-optimism-audit.json'); if(x.scenarios.length!==7 || x.status!=='UNCALIBRATED_SENSITIVITY_NOT_ELECTION_PREDICTIONS') process.exit(1)"
      - name: Validate candidate incumbency and governor-approval context
        run: |
          node --check scripts/incumbency_features.js
          node --check scripts/test_incumbency_features.cjs
          node scripts/test_incumbency_features.cjs
          node scripts/audit_candidate_fundamentals.cjs --json > /tmp/candidate-fundamentals-audit.json
          node -e "const d=require('/tmp/candidate-fundamentals-audit.json');if(d.coverage.total_races!==506 || d.coverage.senate!==35 || d.coverage.governor!==36 || d.minnesota.senate.executive_approval.net_approval_points!==-14 || d.minnesota.approval_transfer_hypothesis.status!=='COUNTERFACTUAL_UNCALIBRATED_NOT_APPLIED_TO_POLLS_OR_ODDS')process.exit(1)"
      - name: Audit alternate two-cycle House fundamentals without promotion
        run: |
          node --check scripts/audit_two_cycle_fundamentals.cjs
          node scripts/audit_two_cycle_fundamentals.cjs --json > /tmp/house-fundamentals-shadow.json
          node -e "const r=require('/tmp/house-fundamentals-shadow.json'); if(r.status!=='EXPERIMENTAL_SHADOW_NOT_PROMOTED' || r.paired_eligible_districts!==191 || r.excluded_districts!==244) process.exit(1)"
          node scripts/audit_two_cycle_fundamentals.cjs
      - name: Validate presidential 2026-map House fundamentals shadow
        run: |
          node --check scripts/audit_presidential_lean_shadow.cjs
          node scripts/audit_presidential_lean_shadow.cjs --json > /tmp/presidential-house-shadow.json
          node -e "const x=require('/tmp/presidential-house-shadow.json'); if(x.house_districts_mapped!==435 || x.redrawn_2026_districts_mapped!==173 || x.status!=='EXPERIMENTAL_PRESIDENTIAL_PARTISAN_LEAN_SHADOW_NOT_PROMOTED' || x.geography.alternative_redrawn_exchangeable_seats!==0) process.exit(1)"
          node scripts/audit_presidential_lean_shadow.cjs
      - name: Audit historical Senate polling misses without retroactive leakage
        run: |
          node --check scripts/chamber_poll_error_audit.js
          node --check scripts/test_chamber_poll_error_audit.cjs
          node scripts/test_chamber_poll_error_audit.cjs
      - name: Audit retrospective Senate probability scores and special-seat priors
        run: |
          node --check scripts/senate_calibration_audit.js
          node scripts/test_senate_calibration_audit.cjs
          node scripts/test_chamber_control_model.cjs
      - name: Install DOM test environment
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
      - name: Check JavaScript syntax and exercise actual dashboard
        run: |
          node --check scripts/test_dashboard_runtime.cjs
          node scripts/test_dashboard_runtime.cjs
