name: Validate election dashboard PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Production-readiness smoke of all deployed assets, linked inputs and four endings
        run: |
          node --check scripts/test_published_dashboard.cjs
          node scripts/test_published_dashboard.cjs --local
      - name: Keep new polls in the actual polling and forecast inputs
        run: |
          python3 scripts/test_poll_source_reconciliation.py
          python3 scripts/test_fresh_poll_sources.py
          python3 scripts/test_poll_to_odds.py
          python3 scripts/validate_poll_to_odds.py
      - name: Reconcile polling error budgets for every House governor and Senate race
        run: |
          node --check scripts/audit_all_race_polling_variance.cjs
          node scripts/audit_all_race_polling_variance.cjs --json > /tmp/all-race-poll-variance.json
          node -e "const x=require('/tmp/all-race-poll-variance.json');if(x.status!=='ALL_OFFICES_WHOLE_RACE_POLLING_VARIANCE_RECONCILED'||x.senate_races_unchanged!==35||x.governor_polled_checked<20||x.house_polled_checked<40||!x.original_source_sigma_is_whole_race||!x.no_silver_odds_or_party_targets)process.exit(1)"
          node scripts/audit_all_race_polling_variance.cjs
      - name: Audit depth-aware Texas Ohio Senate odds against last engine revision
        run: |
          node --check scripts/audit_senate_depth_v5.cjs
          node scripts/audit_senate_depth_v5.cjs --json > /tmp/senate-depth-v5.json
          node -e "const x=require('/tmp/senate-depth-v5.json');if(x.status!=='SENATE_DEPTH_CHANGE_SAME_DRAW_DIAGNOSTIC_NOT_EXTERNAL_ODDS_FIT'||!x.house_and_governor_unchanged||x.races.length!==5||x.private_silver_odds_fitted!==false)process.exit(1)"
          node scripts/audit_senate_depth_v5.cjs
      - name: Verify published 2026 Senate current-candidate odds, variance and House invariance
        run: |
          node --check scripts/chamber_control_model.js
          node --check scripts/test_senate_current_candidate.cjs
          node scripts/test_senate_current_candidate.cjs --json > /tmp/current-senate-forecast.json
          node -e "const x=require('/tmp/current-senate-forecast.json');if(x.status!=='CURRENT_SENATE_PROBABILITIES_PUBLISHED_MODEL_VALIDATION'||x.races.length!==35||x.source_house_probs_unchanged!==true||x.minnesota.model_win_prob_D_new<=x.minnesota.model_win_prob_D_old||x.chamber.old_house_dem_control_pct!==x.chamber.updated_house_dem_control_pct)process.exit(1)"
          node scripts/test_senate_current_candidate.cjs
      - name: Verify isolated 2018 historical Senate results and poll-horizon regeneration
        run: |
          python3 scripts/test_senate_2018_extension.py
          python3 scripts/research_senate_2018_extension.py --verify
          python3 - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('data/historical_senate_2018_horizon_backtest.json').read_text())
          assert o['cycle']==2018 and o['eligible_unambiguous_two_party_outcomes']>=20
          assert len(o['records']['20'])>=15 and len(o['records']['7'])>=15
          assert o['ambiguous_multiple_contests_excluded']==['MN','MS']
          assert not o['can_calibrate_live_2026_model'] and not o['may_change_production_candidate_priors']
          assert not o['poll_release_dates_verified']
          PY
      - name: Audit Senate shared-error covariance with variance conservation
        run: |
          node --check scripts/audit_senate_correlated_error.cjs
          node scripts/audit_senate_correlated_error.cjs --json > /tmp/senate-correlation-research.json
          node -e "const x=require('/tmp/senate-correlation-research.json');if(x.status!=='RESEARCH_ONLY_FOUR_CYCLE_SENATE_SHARED_ERROR_ATTRIBUTION'||!x.unchanged_house_and_governor_race_probabilities||!x.unchanged_each_senate_race_error_width||x.scenarios.length!==3||x.historical_horizons.find(y=>y.days_before_election===20).rough_shared_error_sd<=0||x.historical_horizons.find(y=>y.days_before_election===20).historical_races<58||x.historical_horizons.find(y=>y.days_before_election===20).leave_one_year_out_cycle_mean_scores.length!==3||x.original_three_cycle_archive_untouched!==true||x.calibration_parameter_promotion_permitted!==false)process.exit(1)"
      - name: Verify horizon-based Senate error revision, historic exception and joint covariance
        run: |
          node --check scripts/audit_senate_horizon_floor_v4.cjs
          node scripts/audit_senate_horizon_floor_v4.cjs --json > /tmp/senate-horizon-v4.json
          node -e "const x=require('/tmp/senate-horizon-v4.json');if(x.status!=='PROVISIONAL_2026_SENATE_QUALIFIED_ERROR_REVISION_NOT_FULLY_BACKTESTED'||x.qualified_races_narrowed<8||x.known_2020_20_day_coverage_exception!==true||!x.house_probabilities_unchanged||x.historical_scorecard.find(y=>y.days===20).proposed.brier>=x.historical_scorecard.find(y=>y.days===20).original.brier)process.exit(1)"
      - name: Audit historic Senate probability scores and current uncertainty-tier safety
        run: |
          node --check scripts/chamber_control_model.js
          node --check scripts/audit_senate_probability_calibration.cjs
          node scripts/test_senate_probability_calibration.cjs
          node scripts/audit_senate_probability_calibration.cjs --json > /tmp/senate-error-revision.json
          node -e "const x=require('/tmp/senate-error-revision.json');if(x.status!=='RETROSPECTIVE_INFORMED_2026_UNCERTAINTY_REVIEW_NOT_CALIBRATED'||x.races.length!==35||x.historic_probability_scores.overall.candidate.ninety_pct_margin_coverage<90||x.unchanged_house_probabilities!==true)process.exit(1)"
      - name: Validate private browser-only Silver fundamentals imports without publishing paid CSVs
        run: |
          node --check scripts/private_senate_fundamentals.js
          node --check scripts/test_private_senate_fundamentals.cjs
          node scripts/test_private_senate_fundamentals.cjs
      - name: Reconcile 2026 Senate four endings after poll-priority and unpolled-solid repairs
        run: |
          node --check scripts/audit_senate_four_endings_reconciliation.cjs
          node scripts/audit_senate_four_endings_reconciliation.cjs --json > /tmp/senate-four-endings-reconciliation.json
          node -e "const x=require('/tmp/senate-four-endings-reconciliation.json');if(x.status!=='SENATE_CHAMBER_SHIFT_CURRENT_2026_COMPETITIVENESS_AUDIT'||x.solid_rated_unpolled_races.length!==11-require('./data/race_probabilities.json').records.filter(r=>r.office==='senate'&&['CO','DE','NJ','OR','VA','KY','MS','OK','TN','WV','WY'].includes(r.race_code.slice(0,2))).length||x.outcomes.length!==5||x.outcomes[3].senate_dem_control_pct<=x.outcomes[0].senate_dem_control_pct)process.exit(1)"
          node scripts/audit_senate_four_endings_reconciliation.cjs
      - name: Validate Senate 2020 candidate continuity and statewide presidential audit
        run: |
          node --check scripts/audit_senate_prior_continuity.cjs
          node scripts/test_senate_prior_continuity.cjs
          node scripts/audit_senate_prior_continuity.cjs --json > /tmp/senate-prior-continuity.json
          node -e "const x=require('/tmp/senate-prior-continuity.json');if(x.status!=='SENATE_PRIOR_CONTINUITY_DIAGNOSTIC_NOT_FORECAST'||x.source_model_exact_reconstruction!==true||x.qualified_senate_matchups!==require('./data/race_probabilities.json').records.filter(r=>r.office==='senate').length||x.verified_historic_candidate_identity_count!==12)process.exit(1)"
          node scripts/audit_senate_prior_continuity.cjs
      - name: Validate dashboard contracts
        run: python3 scripts/check_dashboard.py
      - name: Test live polling freshness contract with synthetic moving feeds
        run: python3 scripts/test_fresh_poll_sources.py
      - name: Validate same-date named-poll source identity and live drilldown reconciliation
        run: |
          python3 scripts/test_poll_source_identity.py
          python3 scripts/validate_model_drilldown.py
      - name: Validate new-poll notification behavior without email credentials
        run: python3 scripts/test_poll_alerts.py
      - name: Validate historical Senate election importer without network access
        run: python3 scripts/test_senate_history.py
      - name: Stage MIT Senate research outcomes from official Harvard Dataverse
        run: python3 scripts/stage_senate_history.py
      - name: Test historical Senate poll-only backtesting and date leakage
        run: python3 scripts/test_historical_senate_poll_backtest.py
      - name: Test three historical Senate RCP compilation archives without network
        run: python3 scripts/test_rcp_senate_research.py
      - name: Validate actual archived RCP compilation and historical Senate joins
        run: python3 scripts/research_rcp_senate_backtest.py
      - name: Test multi-horizon Senate historical probability backtest and temporal leakage
        run: |
          python3 scripts/test_senate_horizon_backtest.py
          python3 scripts/research_senate_horizon_backtest.py --no-write
      - name: Test independent election-year heldout national polling-bias diagnostics
        run: python3 scripts/test_senate_bias_holdout.py
      - name: Reproduce historical Senate bias holdouts from published source metrics
        run: python3 scripts/build_senate_bias_holdout.py
      - name: Validate polling model behavior
        run: python3 scripts/test_polling_models.py
      - name: Test 2026 race odds against real poll inputs
        run: python3 scripts/test_race_probabilities.py
      - name: Rebuild 2026 race probabilities from the same polling source
        run: python3 scripts/build_race_probabilities.py
      - name: Verify browser-compatible live official-state election API
        run: python3 scripts/test_live_results_source.py
      - name: Nonpublishing secondary civicAPI 2026 coverage and CORS probe
        continue-on-error: true
        run: python3 scripts/probe_civicapi.py
      - name: Test isolated New Hampshire Senate civicAPI adapter
        run: |
          node --check scripts/civicapi_nh_adapter.js
          node --check scripts/test_civicapi_nh_adapter.cjs
          node scripts/test_civicapi_nh_adapter.cjs
      - name: Test isolated New Hampshire governor civicAPI adapter
        run: |
          node --check scripts/civicapi_nh_governor_adapter.js
          node --check scripts/test_civicapi_nh_governor_adapter.cjs
          node scripts/test_civicapi_nh_governor_adapter.cjs
      - name: Test four-state supplemental civicAPI race adapters
        run: |
          node --check scripts/civicapi_state_batch.js
          node --check scripts/test_civicapi_state_batch.cjs
          node scripts/test_civicapi_state_batch.cjs
      - name: Test Ohio special and six more 2026 statewide race adapters
        run: |
          node --check scripts/civicapi_state_batch.js
          node --check scripts/test_civicapi_oh_wi_ne_ks.cjs
          node scripts/test_civicapi_oh_wi_ne_ks.cjs
      - name: Probe four new states for indexed 2026 civicAPI contests
        continue-on-error: true
        run: python3 scripts/probe_civicapi_oh_wi_ne_ks.py
      - name: Validate seven additional five-state civicAPI race identities
        run: |
          node --check scripts/civicapi_state_batch.js
          node --check scripts/test_civicapi_il_ky_nj_ny_or.cjs
          node scripts/test_civicapi_il_ky_nj_ny_or.cjs
      - name: Discover five additional 2026 civicAPI state race sources
        continue-on-error: true
        run: python3 scripts/probe_civicapi_il_ky_nj_ny_or.py
      - name: Advisory four-state civicAPI source indexing health
        continue-on-error: true
        run: python3 scripts/probe_civicapi_batch.py
      # Third-party 503 is a health warning; source contracts are tested offline.
      - name: Advisory civicAPI live-provider health and CORS
        continue-on-error: true
        run: python3 scripts/test_civicapi_live_source.py
      - name: Test eight additional Senate and governor civicAPI adapters
        run: |
          node --check scripts/civicapi_state_batch.js
          node --check scripts/test_civicapi_al_mt_nm_ok_tn.cjs
          node scripts/test_civicapi_al_mt_nm_ok_tn.cjs
      - name: Discover five more uncovered 2026 states in real civicAPI
        continue-on-error: true
        run: python3 scripts/probe_civicapi_al_mt_nm_ok_tn.py
      - name: Test seven strict CA DE MD SD WY civicAPI race adapters
        run: |
          node --check scripts/civicapi_state_batch.js
          node --check scripts/test_civicapi_ca_de_sd_wy.cjs
          node scripts/test_civicapi_ca_de_sd_wy.cjs
      - name: Probe civicAPI statewide 2026 source IDs in CA DE MS SD WY
        continue-on-error: true
        run: python3 scripts/probe_civicapi_ca_de_ms_sd_wy.py
      - name: Validate experimental live-informed race probabilities
        run: |
          node --check scripts/election_night_nowcast.js
          node --check scripts/test_election_night_nowcast.cjs
          node scripts/test_election_night_nowcast.cjs
      - name: Test isolated five-stage election-night probability rehearsal
        run: |
          node --check scripts/election_night_rehearsal.js
          node --check scripts/test_election_night_rehearsal.cjs
          node scripts/test_election_night_rehearsal.cjs
      - name: Validate contemporary race-poll national environment shadow
        run: |
          node --check scripts/bottom_up_national_environment.js
          node --check scripts/audit_bottom_up_national_environment.cjs
          node scripts/audit_bottom_up_national_environment.cjs --write
          node scripts/audit_bottom_up_national_environment.cjs --check --json > /tmp/bottom-up-modern.json
          node scripts/test_bottom_up_national_environment.cjs
          node -e "const x=require('/tmp/bottom-up-modern.json'); if(x.status!=='SELECTION_BIASED_OBSERVATIONAL_DIAGNOSTIC_NOT_HEADLINE'||x.total_qualifying_races<12||x.states_with_qualified_races<8||x.candidate_specific_effects_removed!==false)process.exit(1)"
      - name: Validate joint House and Senate outcome probabilities
        run: |
          node --check scripts/chamber_control_model.js
          node scripts/test_chamber_control_model.cjs
      - name: Audit single-source joint race odds and Minnesota probability
        run: |
          node --check scripts/audit_joint_race_odds.cjs
          node scripts/audit_joint_race_odds.cjs --json > /tmp/joint-race-odds-audit.json
          node -e "const v=require('/tmp/joint-race-odds-audit.json');if(v.status!=='SOURCE_OF_RACE_ODDS_AUDIT_LEGACY_NOT_USER_FACING'||v.modeled_race_count<475||v.minnesota_senate.legacy_poll_only_research_probability_pct<70||v.minnesota_senate.linked_joint_dem_probability_pct>=v.minnesota_senate.legacy_poll_only_research_probability_pct)process.exit(1)"
      - name: Attribute House/Senate joint control odds and prove variance conservation
        run: |
          node --check scripts/audit_joint_control_gap.cjs
          node scripts/audit_joint_control_gap.cjs --json > /tmp/joint-control-gap.json
          node -e "const d=require('/tmp/joint-control-gap.json');if(d.status!=='UNCALIBRATED_SAME_DRAW_JOINT_CONTROL_GAP_AUDIT'||d.scenarios.length!==6||d.scenarios[0].top_senate_control_bellwethers.length!==12||d.scenarios[0].senate_race_probabilities.length!==35)process.exit(1)"
          node scripts/audit_joint_control_gap.cjs
      - name: Audit Senate total-error variance budget and independent caucus credit
        run: |
          node --check scripts/audit_senate_error_budget.cjs
          node scripts/audit_senate_error_budget.cjs --json > /tmp/senate-error-budget.json
          node -e "const d=require('/tmp/senate-error-budget.json');if(d.status!=='RESEARCH_SENSITIVITY_NOT_CALIBRATED_ODDS'||d.scenarios.length!==5||d.independent_party_proxy_codes.join(',')!=='NE-SEN,SD-SEN'||d.source_whole_race_error_less_than_modeled_shared_component!==true)process.exit(1)"
          node scripts/audit_senate_error_budget.cjs
      - name: Audit forecast optimism under shared polling errors
        run: |
          node --check scripts/forecast_optimism_audit.cjs
          node scripts/forecast_optimism_audit.cjs --json > /tmp/forecast-optimism-audit.json
          node -e "const x=require('/tmp/forecast-optimism-audit.json'); if(x.scenarios.length!==7 || x.status!=='UNCALIBRATED_SENSITIVITY_NOT_ELECTION_PREDICTIONS') process.exit(1)"
      - name: Validate historical candidate overperformance and double-counting
        run: |
          node --check scripts/historical_candidate_strength.js
          node --check scripts/build_historical_candidate_strength.cjs
          node --check scripts/test_historical_candidate_strength.cjs
          node scripts/build_historical_candidate_strength.cjs --check --json > /tmp/incumbent-relative-margin.json
          node scripts/test_historical_candidate_strength.cjs
          node --check scripts/incumbent_persistence_backtest.js
          node scripts/test_incumbent_persistence_backtest.cjs
          node scripts/audit_historical_strength_shadow.cjs --json > /tmp/historic-strength-shadow.json
          node -e "const x=require('/tmp/historic-strength-shadow.json');if(x.training_sample!==148 || x.house2024_baseline_prior_changes!==0 || x.senate_prior_changes!==0 || x.presidential_house_shadow_prior_changes<55)process.exit(1)"
          node -e "const d=require('/tmp/incumbent-relative-margin.json'); if(d.eligible_house_incumbents!==149 || d.eligible_senate_incumbents!==12 || d.independent_election_year_validation!==false) process.exit(1)"
      - name: Enforce modern-only incumbency robustness and era cutoff
        run: |
          node --check scripts/audit_modern_incumbency_robustness.cjs
          node --check scripts/test_modern_incumbency_robustness.cjs
          node scripts/audit_modern_incumbency_robustness.cjs --check --json > /tmp/modern-incumbency-robustness.json
          node scripts/test_modern_incumbency_robustness.cjs
          node -e "const x=require('/tmp/modern-incumbency-robustness.json'); if(x.status!=='MODERN_ERA_DIAGNOSTIC_NO_HEADLINE_FORECAST_PROMOTION' || x.allowed_model_fit_election_years.join(',')!=='2022,2024' || x.cohort_scores.all_modern_2022_2024.sample!==148 || x.cohort_scores.presidential_lean_within_10_points.sample!==32) process.exit(1)"
      - name: Validate candidate incumbency and governor-approval context
        run: |
          node --check scripts/incumbency_features.js
          node --check scripts/test_incumbency_features.cjs
          node scripts/test_incumbency_features.cjs
          node scripts/audit_candidate_fundamentals.cjs --json > /tmp/candidate-fundamentals-audit.json
          node -e "const d=require('/tmp/candidate-fundamentals-audit.json');if(d.coverage.total_races!==506 || d.coverage.senate!==35 || d.coverage.governor!==36 || d.minnesota.senate.executive_approval.net_approval_points!==-14 || d.minnesota.approval_transfer_hypothesis.status!=='COUNTERFACTUAL_UNCALIBRATED_NOT_APPLIED_TO_POLLS_OR_ODDS')process.exit(1)"
      - name: Check local-only external forecast CSV reader on synthetic fixtures
        run: |
          node --check scripts/compare_external_forecast_local.cjs
          node --check scripts/test_external_forecast_comparison.cjs
          node scripts/test_external_forecast_comparison.cjs
      - name: Validate same-draw turnout-weighted House vote to seat diagnostics
        run: |
          node --check scripts/audit_joint_vote_seats.cjs
          node scripts/audit_joint_vote_seats.cjs --json > /tmp/vote-seat-diagnostic.json
          node -e "const x=require('/tmp/vote-seat-diagnostic.json');if(x.status!=='EXPERIMENTAL_VOTE_SEAT_SAME_DRAW_REFERENCE_ONLY'||x.bins.reduce((a,b)=>a+b.sample_count,0)!==x.samples||x.district_geography_year!==2026)process.exit(1)"
          node scripts/audit_joint_vote_seats.cjs
      - name: Audit House 2024 uncontested vote reference and 2026 geography seat response
        run: |
          node --check scripts/audit_house_seat_vote_reference.cjs
          node scripts/audit_house_seat_vote_reference.cjs --json > /tmp/house-seat-vote-reference.json
          node -e "const x=require('/tmp/house-seat-vote-reference.json');if(x.status!=='HOUSE_NATIONAL_REFERENCE_AND_SEAT_RESPONSE_RESEARCH_ONLY'||x['2024_missing_two_party_vote_count']!==44||x['2026_redrawn_districts']!==173||x.presidential_mapped_districts!==435||x.model_scenarios.length!==4||x.house_margin_shift_response.curve.length!==7||x.model_scenarios[0].house_top_same_draw_control_bellwethers.length!==25)process.exit(1)"
          node scripts/audit_house_seat_vote_reference.cjs
      - name: Audit alternate two-cycle House fundamentals without promotion
        run: |
          node --check scripts/audit_two_cycle_fundamentals.cjs
          node scripts/audit_two_cycle_fundamentals.cjs --json > /tmp/house-fundamentals-shadow.json
          node -e "const r=require('/tmp/house-fundamentals-shadow.json'); if(r.status!=='EXPERIMENTAL_SHADOW_NOT_PROMOTED' || r.paired_eligible_districts!==191 || r.excluded_districts!==244) process.exit(1)"
          node scripts/audit_two_cycle_fundamentals.cjs
      - name: Audit 2026-map presidential gap-fill preserving valid House returns
        run: |
          node --check scripts/audit_house_geography_gapfill.cjs
          node scripts/audit_house_geography_gapfill.cjs --json > /tmp/house-geography-gapfill.json
          node -e "const r=require('/tmp/house-geography-gapfill.json');if(r.status!=='RESEARCH_GEOGRAPHY_GAP_FILL_PENDING_HELD_OUT_VALIDATION'||r.candidate_blind_presidential_prior_used_in!==197||r.candidate_2024_vote_exact_reused_in!==238||r.models.length!==3)process.exit(1)"
          node scripts/audit_house_geography_gapfill.cjs
      - name: Validate presidential 2026-map House fundamentals shadow
        run: |
          node --check scripts/audit_presidential_lean_shadow.cjs
          node scripts/audit_presidential_lean_shadow.cjs --json > /tmp/presidential-house-shadow.json
          node -e "const x=require('/tmp/presidential-house-shadow.json'); if(x.house_districts_mapped!==435 || x.redrawn_2026_districts_mapped!==173 || x.status!=='EXPERIMENTAL_PRESIDENTIAL_PARTISAN_LEAN_SHADOW_NOT_PROMOTED' || x.geography.alternative_redrawn_exchangeable_seats!==0) process.exit(1)"
          node scripts/audit_presidential_lean_shadow.cjs
      - name: Audit historical Senate polling misses without retroactive leakage
        run: |
          node --check scripts/chamber_poll_error_audit.js
          node --check scripts/test_chamber_poll_error_audit.cjs
          node scripts/test_chamber_poll_error_audit.cjs
      - name: Audit retrospective Senate probability scores and special-seat priors
        run: |
          node --check scripts/senate_calibration_audit.js
          node scripts/test_senate_calibration_audit.cjs
          node scripts/test_chamber_control_model.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install DOM test environment
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
      - name: Check JavaScript syntax and exercise actual dashboard
        run: |
          node --check scripts/test_dashboard_runtime.cjs
          node scripts/test_dashboard_runtime.cjs
