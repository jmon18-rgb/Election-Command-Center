name: Verify coherent 2022 and 2024 House history
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*house*history*'
      - 'scripts/reconcile_house_historical_context.cjs'
      - 'scripts/historical_candidate_strength.js'
      - 'data/house_historical_sources/**'
      - 'data/house_history_*'
      - 'data/house_geography_bridge.json'
      - 'data/house_two_cycle_context.json'
      - 'data/house_2024_candidate_results_staging.json'
      - 'data/historical_candidate_overperformance_2026.json'
      - 'data/candidate_fundamentals_staging.json'
      - '.github/workflows/stage-house-history.yml'
  push:
    branches: [main]
    paths:
      - scripts/stage_house_history_2024.py
      - scripts/test_house_history.py
      - .github/workflows/stage-house-history.yml
permissions:
  contents: read
concurrency:
  group: stage-house-history
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit-test source parser and geography firewall
        run: python3 scripts/test_house_history.py
      - name: Verify pinned originals and every historical descendant together
        run: |
          python3 scripts/rebuild_house_history_bundle.py
          python3 scripts/test_house_history_migration.py
          node scripts/test_house_history_migration.cjs
          node scripts/audit_house_history_repair.cjs --check
      - name: Require a reviewed coherent commit rather than source-only publication
        run: git diff --exit-code
