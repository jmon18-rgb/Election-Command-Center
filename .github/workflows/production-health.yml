name: Verify deployed election dashboard
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  schedule:
    # A deployed Pages build (not the earlier main push) triggers validation.
    # Independent two-hour checks still detect lasting production outages.
    - cron: '53 */2 * * *'
    # On Nov 3 after afternoon polls approach closing, and through Nov 4
    # morning, reduce unattended deployed-site verification intervals.
    # GitHub Actions scheduled starts are best-effort, not real-time alerts.
    - cron: '*/15 21-23 3 11 *'
    - cron: '*/15 0-12 4 11 *'
permissions:
  contents: read
concurrency:
  group: deployed-election-health
  cancel-in-progress: false
jobs:
  live-site:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the real Pages HTML, assets, source freshness and full forecast
        env:
          DASHBOARD_SITE_URL: ${{ vars.DASHBOARD_SITE_URL }}
        run: |
          node --check scripts/test_published_dashboard.cjs
          node scripts/test_published_dashboard.cjs --remote
