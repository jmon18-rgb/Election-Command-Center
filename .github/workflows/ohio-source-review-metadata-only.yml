name: Test Ohio Election Night source-approval metadata extraction
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/prepare_ohio_nist_manual_review.py'
      - 'scripts/test_prepare_ohio_nist_manual_review.py'
      - '.github/workflows/ohio-source-review-metadata-only.yml'
permissions:
  contents: read
jobs:
  offline-identities-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fail-closed Ohio county, contest and party review proposal
        run: |
          python3 -m py_compile scripts/prepare_ohio_nist_manual_review.py
          python3 scripts/test_prepare_ohio_nist_manual_review.py
          python3 scripts/test_build_approved_ohio_nist_results.py
