name: Refresh approved NC election-night candidate counts
on:
  workflow_dispatch:
  schedule:
    # 2026 election night; the Python gate rejects all other dates/years.
    # UTC: November 3 4-6 PM Eastern and Nov 4 overnight.
    - cron: '*/10 21-23 3 11 *'
    - cron: '*/10 0-8 4 11 *'
  pull_request:
    paths:
      - 'scripts/refresh_approved_nc_zip.py'
      - 'scripts/test_refresh_approved_nc_zip.py'
      - 'data/nc_county_results_desk_config.json'
      - 'data/nc_candidate_votes_2026.json'
      - '.github/workflows/nc-approved-zip-refresh.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse unapproved or pre-close published North Carolina county ZIP
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import sys
          sys.path.insert(0, 'scripts')
          from build_nc_official_candidate_votes_2026 import validate_review
          from refresh_approved_nc_zip import POLL_CLOSE, OUTPUT_PATH
          c=json.load(open('data/nc_county_results_desk_config.json'))
          if c.get('schema')!='county-desk-config-v1':
              raise ValueError('NC official ZIP source approval schema invalid')
          if c.get('enabled') is True:
              if dt.datetime.now(dt.timezone.utc)<POLL_CLOSE:
                  raise ValueError('Cannot approve candidate vote publication before NC polls close')
              if c.get('snapshot_path')!=OUTPUT_PATH:
                  raise ValueError('Approved county ZIP output path incorrect')
              validate_review(c.get('expected'))
              print('Reviewed NC ZIP source and post-poll activation contract confirmed')
          elif c.get('enabled') is False and c.get('expected') is None and c.get('snapshot_path') is None:
              print('NC source disabled, no 2026 vote publication allowed')
          else:
              raise ValueError('NC source config inconsistent; possible premature approval')
          PY
      - name: Validate official ZIP monotonicity, exact source and disabled safety
        run: |
          python3 -m py_compile scripts/refresh_approved_nc_zip.py
          python3 scripts/test_refresh_approved_nc_zip.py
          python3 scripts/test_build_nc_official_candidate_votes_2026.py
          node scripts/test_nc_official_candidate_votes.cjs
  publish:
    # Only main and only after a separately approved source configuration.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      pages: write
    concurrency:
      group: nc-approved-candidate-zip-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh approved exact-source ZIP (disabled before human verification)
        run: python3 scripts/refresh_approved_nc_zip.py
      - name: Commit both snapshot and new pinned archive fingerprint atomically
        id: publish
        run: |
          git add data/nc_county_results_desk_config.json
          if [ -f data/nc_candidate_votes_2026.json ]; then git add data/nc_candidate_votes_2026.json; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh source-attributed NC county candidate votes"
            # Other independent polling, source-identity and results refresh
            # jobs can commit while this source download is being validated.
            # Replay ONLY non-conflicting changes; an approval/source JSON
            # conflict MUST fail for manual review, never force-push.
            published=false
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Election source approval/snapshot changed concurrently; manual review required"
                exit 1
              fi
              if git push origin HEAD:main; then
                published=true
                break
              fi
              echo "Main changed during approved vote publication, retry $attempt/3"
              sleep "$((attempt * 2))"
            done
            if [ "$published" != "true" ]; then
              echo "::error::Reviewed election source could not reach main after three safe retries"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No reviewed official ZIP candidate vote changes to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # GitHub documents that a GITHUB_TOKEN push does NOT launch a
      # deploy-from-branch Pages build. Explicitly request one after commit.
      - name: Ensure approved candidate snapshot reaches GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          approved="$(python3 -c 'import json; c=json.load(open("data/nc_county_results_desk_config.json")); print(str(c.get("enabled") is True).lower())')"
          if [ "$approved" != "true" ]; then
            echo "No approved county feed; no Pages rebuild needed"
            exit 0
          fi
          # Even if a prior run committed successfully but the Pages API
          # failed, the next run retries publication of that HEAD.
          git fetch origin main
          head_sha="$(git rev-parse origin/main)"
          latest_sha="$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.commit // ""' 2>/dev/null || true)"
          latest_status="$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.status // ""' 2>/dev/null || true)"
          if [ "$head_sha" = "$latest_sha" ] && [ "$latest_status" = "built" ]; then
            echo "Latest reviewed source revision already deployed"
            exit 0
          fi
          if [ "$head_sha" = "$latest_sha" ] && [ "$latest_status" = "building" -o "$latest_status" = "queued" ]; then
            echo "Pages build for current revision already queued"
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh api -X POST "repos/${{ github.repository }}/pages/builds" >/tmp/nc-pages-build.json; then
              cat /tmp/nc-pages-build.json
              exit 0
            fi
            echo "Pages build request failed or busy (attempt $attempt)"
            sleep 10
          done
          echo "County snapshot may be committed but Pages rebuild could not be requested" >&2
          exit 1
