name: Verify Nebraska named-candidate county connection
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/*nebraska*'
      - 'data/nebraska*'
      - 'data/nebraska_senate_sources/**'
      - 'scripts/national_county_likelihood.js'
      - 'scripts/chamber_control_model.js'
      - 'scripts/personal_election_focus.js'
      - 'scripts/competitive_source_revision.js'
      - 'scripts/test_washington_national_bridge.cjs'
      - '.github/workflows/nebraska-senate-connection.yml'
permissions:
  contents: read
jobs:
  historical-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf==6.10.0
      - run: |
          python scripts/test_build_nebraska_senate_candidate_reference.py
          python -O scripts/test_build_nebraska_senate_candidate_reference.py
          python scripts/build_nebraska_senate_candidate_reference.py
          git diff --exit-code -- data/nebraska_senate_2024_candidate_reference.json
  counts-and-joint-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/test_nebraska_county_source.cjs
          node scripts/test_nebraska_controller_budget.cjs
          node scripts/test_nebraska_national_bridge.cjs
          node scripts/test_washington_national_bridge.cjs
          node scripts/test_competitive_live_source_report.cjs
          node scripts/test_personal_election_focus.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test_nebraska_national_browser.mjs
