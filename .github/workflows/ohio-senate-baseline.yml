name: Verify close Ohio Senate historical county baseline
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*ohio*senate*baseline*'
      - 'scripts/*ohio*civic*'
      - 'data/ohio_historical_sources/**'
      - 'data/ohio_source_documents/**'
      - 'data/ohio_senate_2024_county_baseline_official.json'
      - 'data/ohio_county_fips_reference.json'
      - 'data/texas_historical_sources/2024-census-counties.zip'
      - '.github/workflows/ohio-senate-baseline.yml'
permissions:
  contents: read
jobs:
  historical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python scripts/test_build_ohio_senate_county_baseline.py
      - run: git diff --exit-code -- data/ohio_senate_2024_county_baseline_official.json data/ohio_county_fips_reference.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_ohio_civic_county_source.cjs
