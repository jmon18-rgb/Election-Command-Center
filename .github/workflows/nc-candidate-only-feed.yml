name: Validate NC official candidate-only county result snapshots
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/nc_official_candidate_votes.js'
      - 'scripts/test_nc_official_candidate_votes.cjs'
      - 'scripts/build_nc_official_candidate_votes_2026.py'
      - 'scripts/test_build_nc_official_candidate_votes_2026.py'
      - 'scripts/nc_county_results_desk_startup.js'
      - 'index.html'
      - '.github/workflows/nc-candidate-only-feed.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm official archive exporter and candidate-count-only invariants
        run: |
          python3 -m py_compile scripts/build_nc_official_candidate_votes_2026.py
          python3 scripts/test_build_nc_official_candidate_votes_2026.py
      - name: Validate browser candidate-only contract and timestamps
        run: |
          node --check scripts/nc_official_candidate_votes.js
          node --check scripts/nc_county_results_desk_startup.js
          node scripts/test_nc_official_candidate_votes.cjs
          node scripts/test_election_night_county_results_desk.cjs
