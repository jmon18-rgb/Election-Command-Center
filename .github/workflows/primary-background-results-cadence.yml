name: Validate independent Senate refresh during primary-source backoff
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test_primary_background_refresh.cjs'
      - '.github/workflows/primary-background-results-cadence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-interval-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Senate refresh and House retry remain independently scheduled
        run: node scripts/test_primary_background_refresh.cjs
