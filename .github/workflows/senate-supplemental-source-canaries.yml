name: Preflight all 18 supplemental Senate source IDs in rotating batches
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/preflight_pinned_senate_sources.py'
      - 'scripts/test_preflight_pinned_senate_sources.py'
      - '.github/workflows/senate-supplemental-source-canaries.yml'
      - 'scripts/civicapi_state_batch.js'
      - 'data/election_night_source_coverage.json'
  schedule:
    # At most seven endpoint checks daily; cover 18 pinned Senate IDs
    # across four days (or four hourly election-night windows).
    - cron: '40 15 * * *'
    # Rotate across all 18 Senate pins in four consecutive hourly checks.
    - cron: '13 23 3 11 *'
    - cron: '13 0-10 4 11 *'
permissions:
  contents: read
jobs:
  identity-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm all 18 pinned Senate IDs and four-hour Election Night rotation
        run: |
          python3 -m py_compile scripts/preflight_pinned_senate_sources.py
          python3 scripts/test_preflight_pinned_senate_sources.py
  live-transport-check:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: identity-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check bounded real civicAPI Senate detail HTTP, CORS and exact ballot identity
        run: |
          python3 scripts/preflight_pinned_senate_sources.py \
            --ledger data/election_night_source_coverage.json \
            --adapter scripts/civicapi_state_batch.js \
            --output /tmp/pinned-senate-canary.json
      - name: Retain exact result-source canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-senate-source-preflight
          path: /tmp/pinned-senate-canary.json
          retention-days: 14
          if-no-files-found: ignore
