name: National Election Needle Cartogram
on:
  push:
    paths:
      - 'scripts/national_needle_cartogram.js'
      - 'scripts/us_state_display_geometry.js'
      - 'scripts/build_us_state_display_geometry.py'
      - 'scripts/test_us_state_display_geometry.cjs'
      - 'data/display_geometry_sources/**'
      - 'data/us_state_display_geometry_source.json'
      - 'scripts/test_national_needle_cartogram.cjs'
      - 'scripts/test_election_night_hierarchy_browser.mjs'
      - 'index.html'
      - '.github/workflows/national-needle-cartogram.yml'
  pull_request:
    paths:
      - 'scripts/national_needle_cartogram.js'
      - 'scripts/us_state_display_geometry.js'
      - 'scripts/build_us_state_display_geometry.py'
      - 'scripts/test_us_state_display_geometry.cjs'
      - 'data/display_geometry_sources/**'
      - 'data/us_state_display_geometry_source.json'
      - 'scripts/test_national_needle_cartogram.cjs'
      - 'scripts/test_election_night_hierarchy_browser.mjs'
      - 'index.html'
      - '.github/workflows/national-needle-cartogram.yml'
  workflow_dispatch:
jobs:
  cartogram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone map module and click-through safeguards
        run: |
          node --check scripts/national_needle_cartogram.js
          node --check scripts/test_national_needle_cartogram.cjs
          node scripts/test_national_needle_cartogram.cjs
          node scripts/test_us_state_display_geometry.cjs
          python scripts/build_us_state_display_geometry.py
          git diff --exit-code -- scripts/us_state_display_geometry.js
      - name: Ensure main dashboard mounts the guarded map
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');for(const x of ['id=\"enNationalNeedleMap\"','national_needle_cartogram.js','function enRenderNeedleCartogram()','enRenderNeedleCartogram();'])if(!s.includes(x))throw Error('Missing map wiring: '+x)"
  operator-tasks:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Laptop and mobile map, source disclosure and focus tasks
        run: node scripts/test_election_night_hierarchy_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: election-night-hierarchy-tasks
          path: artifacts/readiness/ui-review/hierarchy-*
