name: DE and WY official November 2026 results link discovery
on:
  pull_request:
    paths:
      - 'scripts/probe_de_wy_2026_official_general_links.py'
      - 'scripts/test_probe_de_wy_2026_official_general_links.py'
      - '.github/workflows/de-wy-2026-general-results-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/probe_de_wy_2026_official_general_links.py'
      - 'scripts/test_probe_de_wy_2026_official_general_links.py'
      - '.github/workflows/de-wy-2026-general-results-discovery.yml'
  schedule:
    - cron: '28 13 * * *'
    - cron: '46 * 3-4 11 *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-de-wy-link-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test current-year official host restrictions and mock/primary exclusions
        run: |
          python -m py_compile scripts/probe_de_wy_2026_official_general_links.py
          python scripts/test_probe_de_wy_2026_official_general_links.py
      - name: Advisory official 2026 General Election link discovery only
        run: |
          python scripts/probe_de_wy_2026_official_general_links.py --probe | tee /tmp/de-wy-2026-general-links.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path('/tmp/de-wy-2026-general-links.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Delaware and Wyoming official 2026 General Election link discovery\n')
              for state,record in x.items():
                  out.write('- '+state+': '+record['status']+' · '+str(len(record['candidate_official_links']))+' candidate links\n')
                  assert record['automated_feed_verified'] is False
                  assert record['may_update_model'] is False
                  assert record['candidate_votes'] is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: de-wy-2026-general-official-metadata-only
          path: /tmp/de-wy-2026-general-links.json
          retention-days: 30
