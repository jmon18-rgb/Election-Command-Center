name: Guard browser supplemental source-cache freshness
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test_browser_civic_cache_freshness.cjs'
      - 'scripts/election_night_poll_closings_2026.js'
      - '.github/workflows/election-night-civic-cache-freshness.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/test_browser_civic_cache_freshness.cjs'
      - 'scripts/election_night_poll_closings_2026.js'
      - '.github/workflows/election-night-civic-cache-freshness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-cache-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject stale, future, preclose and outage-cached source votes
        run: |
          node --check scripts/test_browser_civic_cache_freshness.cjs
          node scripts/test_browser_civic_cache_freshness.cjs
          node scripts/test_election_night_poll_closings_2026.cjs
