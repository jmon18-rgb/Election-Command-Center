name: Election Night External Source Preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/election-night-source-preflight.yml'
      - 'scripts/test_live_results_source.py'
      - 'scripts/test_civicapi_live_source.py'
      - 'scripts/probe_house_coverage_2026.py'
      - 'scripts/test_house_coverage_2026.py'
      - 'scripts/probe_missing_statewide_sources_2026.py'
      - 'scripts/test_probe_missing_statewide_sources_2026.py'
      - 'scripts/build_election_night_source_coverage.py'
      - 'scripts/test_election_night_source_coverage.py'
      - 'scripts/check_house_pins_pages_publication.py'
      - 'scripts/test_check_house_pins_pages_publication.py'
      - 'scripts/resolve_election_source_preflight.py'
      - 'scripts/test_resolve_election_source_preflight.py'
      - 'scripts/civicapi_house_2026_adapter.js'
      - 'scripts/test_civicapi_house_2026_adapter.cjs'
      - 'scripts/test_election_night_source_coverage.py'
      - 'scripts/civicapi_state_batch.js'
      - 'scripts/election_night_reconciliation.js'
      - 'data/seat_universe.json'
  schedule:
    # Hourly discovery plus a second bounded scan during Election Night only.
    # 41-minute scheduled runs OUTSIDE the counting window are skipped.
    - cron: '11 * * 10,11 *'
    - cron: '41 * * 10,11 *'
permissions:
  contents: write
  pages: write
concurrency:
  group: election-night-source-preflight
  cancel-in-progress: true
jobs:
  external-api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve election-year preflight window
        id: window
        env:
          SOURCE_PREFLIGHT_EVENT: ${{ github.event_name }}
          SOURCE_PREFLIGHT_SCHEDULE: ${{ github.event.schedule }}
        # Queue delays can cross a half-hour or hour boundary. The matched
        # cron identifies the slot; the actual UTC clock still gates counting.
        run: python3 scripts/resolve_election_source_preflight.py
      - name: Verify Open America source CORS, year, office and 2026 race schema
        id: primary
        if: steps.window.outputs.run == 'true' && steps.window.outputs.baseline == 'true'
        continue-on-error: true
        run: python3 scripts/test_live_results_source.py
      - name: Verify independently identified civicAPI 2026 races and browser CORS
        id: secondary
        if: steps.window.outputs.run == 'true' && steps.window.outputs.baseline == 'true'
        continue-on-error: true
        run: python3 scripts/test_civicapi_live_source.py
      - name: Probe up to eight House source identities (30-min during counting)
        id: house_probe
        if: steps.window.outputs.run == 'true'
        continue-on-error: true
        env:
          ELECTION_HOUSE_PROBE_OUTPUT: /tmp/house_probe_2026.json
        run: |
          python3 scripts/probe_house_coverage_2026.py
      # Four statewide advisory identity checks run at the same bounded
      # cadence as the general provider contract (hourly on Election Day).
      # Provider failure is recorded as UNKNOWN, never as zero votes.
      # No ID found here is inserted into the approved adapter.
      - name: Probe MA/MS Senate and HI/OK governor identity evidence
        id: statewide_probe
        if: steps.window.outputs.run == 'true' && steps.window.outputs.baseline == 'true'
        continue-on-error: true
        run: |
          python3 scripts/probe_missing_statewide_sources_2026.py \
            --output /tmp/statewide_source_probe_2026.json
      - name: Build 506-race persistent source identity coverage snapshot
        id: coverage
        if: always() && steps.window.outputs.run == 'true'
        continue-on-error: true
        env:
          PRIMARY: ${{ steps.primary.outcome }}
          SECONDARY: ${{ steps.secondary.outcome }}
          HOUSE_PROBE: ${{ steps.house_probe.outcome }}
        run: |
          python3 scripts/build_election_night_source_coverage.py \
            --probe /tmp/house_probe_2026.json \
            --statewide-probe /tmp/statewide_source_probe_2026.json \
            --primary-check "$PRIMARY" \
            --secondary-check "$SECONDARY" \
            --house-check "$HOUSE_PROBE"
      - name: Preserve source gap snapshot in repository history
        id: persist
        if: always() && steps.window.outputs.run == 'true' && steps.coverage.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "election-briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/election_night_source_coverage.json data/election_night_house_pins.json
          if ! git diff --cached --quiet; then
            git commit -m "Record 506-race source identity coverage and gap health"
            # Concurrent hourly briefing/approved NC-OH publication can
            # advance main between the source preflight checkout and push.
            # Never force-push or accept an unresolved conflict in identity
            # hints. Only non-conflicting latest-base updates are replayed.
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Source identity manifest changed concurrently; manual review required"
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Another publisher advanced main (attempt $attempt/3)"
              sleep "$((attempt * 2))"
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Could not publish 506-race source ledger to main after three safe retries"
              exit 1
            fi
          fi
      # GITHUB_TOKEN pushes do not launch a normal Pages branch build. Check
      # the actually served identity hints, ignoring generated_at churn, and
      # publish only when real district/provider IDs differ or remote access
      # is broken. An outage cannot silently become "no new source".
      - name: Verify deployed House IDs and publish newly verified source pins
        id: pages_pins
        if: always() && steps.window.outputs.run == 'true' && steps.persist.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DASHBOARD_SITE_URL: ${{ vars.DASHBOARD_SITE_URL }}
        run: |
          set -euo pipefail
          site="${DASHBOARD_SITE_URL:-https://jmon18-rgb.github.io/Election-Command-Center/}"
          case "$site" in https://*) ;; *) echo "::error::Expected HTTPS Pages site"; exit 1;; esac
          url="${site%/}/data/election_night_house_pins.json"
          if ! curl --fail --silent --show-error --max-time 20                -H 'Cache-Control: no-cache' "$url" -o /tmp/served-house-pins.json; then
            echo 'No verified published House pin manifest; rebuilding Pages'
            printf '{}' >/tmp/served-house-pins.json
          fi
          python3 scripts/check_house_pins_pages_publication.py             --remote /tmp/served-house-pins.json             --local data/election_night_house_pins.json             --output-env "$GITHUB_OUTPUT"
          if ! grep -qx 'pins_need_pages_build=true' "$GITHUB_OUTPUT"; then
            echo 'House race ID pins already present on deployed Pages'
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh api -X POST "repos/${{ github.repository }}/pages/builds"; then
              echo 'Requested Pages rebuild for newly verified 2026 House source IDs'
              exit 0
            fi
            echo "Pages build busy or rejected ($attempt/3)"
            sleep "$((attempt * 3))"
          done
          echo "::error::New verified House source IDs could not be requested for Pages deployment"
          exit 1
      - name: Preserve rotating House source inventory and missing-race evidence
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 2026-house-source-probe-${{ github.run_id }}
          path: /tmp/house_probe_2026.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve 506-race report even after a source outage
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 2026-source-coverage-ledger-${{ github.run_id }}
          path: |
            data/election_night_source_coverage.json
            data/election_night_house_pins.json
          if-no-files-found: warn
          retention-days: 90
      - name: Record source health and fail if either provider contract is broken
        if: always() && steps.window.outputs.run == 'true'
        env:
          PRIMARY: ${{ steps.primary.outcome }}
          SECONDARY: ${{ steps.secondary.outcome }}
          HOUSE_PROBE: ${{ steps.house_probe.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
          PERSIST: ${{ steps.persist.outcome }}
          PAGES_PINS: ${{ steps.pages_pins.outcome }}
          BASELINE: ${{ steps.window.outputs.baseline }}
        run: |
          echo "## Direct-browser 2026 election source preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checked: $(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Open America (22-state primary source): $PRIMARY (intentionally skipped between four-hour windows)" >> "$GITHUB_STEP_SUMMARY"
          echo "- civicAPI (individually verified supplementary races): $SECONDARY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hourly eight-district House identity checks: $HOUSE_PROBE" >> "$GITHUB_STEP_SUMMARY"
          echo "- 506-race source audit and House ID hint manifest built / persisted: $COVERAGE / $PERSIST" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified House source IDs checked against live GitHub Pages: $PAGES_PINS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks test HTTP, browser CORS and strict year/race schema; the 506-race ledger is source identity **not live-result availability or winner calls**." >> "$GITHUB_STEP_SUMMARY"
          if { [ "$BASELINE" = "true" ] && { [ "$PRIMARY" != "success" ] || [ "$SECONDARY" != "success" ]; }; } || \
             { [ "$BASELINE" = "false" ] && { [ "$PRIMARY" != "skipped" ] || [ "$SECONDARY" != "skipped" ]; }; } || \
             [ "$HOUSE_PROBE" != "success" ] || [ "$COVERAGE" != "success" ] || [ "$PERSIST" != "success" ] || [ "$PAGES_PINS" != "success" ]; then
            echo "::error::Election-night source preflight failed (including rotating House audit). Investigate; missing and untested seats are unknown, never zero or historical fallback."
            exit 1
          fi
